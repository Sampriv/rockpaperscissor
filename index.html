<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <p>First to 5 points wins.</p>
      <div class="choices" aria-label="Choose your move">
        <button type="button" data-choice="rock">
          <img src="./images/rock.svg" alt="Rock" width="90" height="90" />
        </button>
        <button type="button" data-choice="paper">
          <img src="./images/paper.svg" alt="Paper" width="90" height="90" />
        </button>
        <button type="button" data-choice="scissors">
          <img src="./images/scissors.svg" alt="Scissors" width="90" height="90" />
        </button>
      </div>
      <div id="result">Choose a move.</div>
      <div id="score">Human: 0 | Computer: 0</div>
      <div id="status" aria-live="polite"></div>
      <button id="reset" type="button">Play again</button>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
