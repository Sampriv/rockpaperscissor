<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <p>First to 5 points wins.</p>
      <div class="choices" aria-label="Choose your move">
        <button type="button" data-choice="rock">Rock</button>
        <button type="button" data-choice="paper">Paper</button>
        <button type="button" data-choice="scissors">Scissors</button>
      </div>
      <div id="result">Choose a move.</div>
      <div id="score">Human: 0 | Computer: 0</div>
      <div id="status" aria-live="polite"></div>
      <button id="reset" type="button">Play again</button>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
